name: replay

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Serialize: two visitors forking at once would race on the same README commit.
concurrency:
  group: replay
  cancel-in-progress: false

jobs:
  replay:
    if: "startsWith(github.event.issue.title, 'replay: fork ')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replay
        env:
          # Untrusted: any GitHub user can open an issue. Passed as an env var
          # so it is never interpolated into a shell command. replay.mjs
          # validates it (see replay/test.mjs).
          TITLE: ${{ github.event.issue.title }}
        run: node replay/replay.mjs --from-env

      - name: Commit
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "already showing this fork"
          else
            git commit -m "replay: fork requested in #${ISSUE}" -- README.md
            git push
          fi

      - name: Close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body \
            "Replayed. The README now shows that timeline — the commit is the audit log."
          gh issue close "$ISSUE"
